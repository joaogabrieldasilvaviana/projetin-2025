<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClashTermo Royale + Cruzadinha</title>

    <!-- CSS básico (crie um styles.css ou cole direto em <style>) -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- ================= MENU ================= -->
    <div class="menu-container">
        <button class="menu-btn active" data-game="termo">⚔ Termo Royale</button>
        <button class="menu-btn" data-game="cruzadinha">🧩 Cruzadinha</button>
    </div>


    <!-- ================ TERMO ================= -->
    <section id="termo-game" class="game-section active">

        <h2>TERMO ROYALE</h2>

        <div id="board" class="board"></div>

        <div id="keyboard" class="keyboard"></div>

    </section>


    <!-- ============== CRUZADINHA ============== -->
    <section id="cruzadinha-game" class="game-section">

        <h2>CRUZADINHA MESTRA</h2>

        <div class="cruzadinha-container">

            <!-- GRID PRINCIPAL -->
            <div class="cruzadinha-grid-container"></div>

            <!-- DICAS -->
            <div class="clues-container">
                <h3>Horizontais</h3>
                <ul id="clues-across"></ul>

                <h3>Verticais</h3>
                <ul id="clues-down"></ul>
            </div>
        </div>

        <!-- TECLADO DA CRUZADINHA -->
        <div id="cruzadinha-keyboard"></div>

        <!-- RESET -->
        <button id="cruz-reset" class="reset-btn">🔁 Reiniciar</button>

    </section>


    <!-- ============ POPUPS DE MENSAGEM =========== -->
    <div id="popup-container"></div>

    <!-- ============ SCRIPTS ============ -->
    <script src="script.js"></script>

</body>
</html>
